<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asset Camera Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
margin:0;
background:black;
font-family:sans-serif;
}

video{
width:100vw;
height:100vh;
object-fit:cover;
}

#status{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,0.6);
color:white;
padding:8px;
font-size:14px;
}

#overlay{

position:fixed;
bottom:0;
width:100%;
background:rgba(0,0,0,0.85);
color:#00ff99;
padding:14px;
font-size:16px;

}

</style>
</head>

<body>

<div id="status">กำลังโหลดข้อมูล...</div>

<video id="video" autoplay playsinline></video>

<div id="overlay">รอสแกน...</div>

<script>

const video=document.getElementById("video")
const status=document.getElementById("status")
const overlay=document.getElementById("overlay")

let ASSETS={}

const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQpXuB-T6npWk7MYedMvVFZCNghCnMg9Iu79j0KcMVreOMhksr6pLmOGpdGwfftRzRUMJGnPtr0H4wP/pub?gid=0&single=true&output=csv"


// โหลดข้อมูลจาก Google Sheet

fetch(SHEET_URL)

.then(res=>res.text())

.then(csv=>{

const rows=csv.split("\n").slice(1)

rows.forEach(r=>{

const c=r.split(",")

const fullCode=(c[1]||"").trim()

if(!fullCode)return

const code8=fullCode.replace(/[^0-9]/g,"").substring(0,8)

ASSETS[code8]=`

<b>รหัส:</b> ${fullCode}<br>

<b>หมายเลขผู้ผลิต:</b> ${c[6]||"-"}<br>

<b>รายละเอียด:</b> ${c[3]||"-"}<br>

<b>มูลค่า:</b> ${c[8]||"-"} บาท<br>

<b>มูลค่าตามบัญชี:</b> ${c[10]||"-"} บาท<br>

<b>ชื่อผู้ครอบครอง:</b> ${c[13]||"-"}<br>

<b>สถานะ:</b> ${c[11]||"-"}

`

})

status.innerText="โหลดข้อมูลสินทรัพย์เรียบร้อย"

})

.catch(err=>{

status.innerText="โหลดข้อมูลไม่สำเร็จ"

})



// เปิดกล้อง

navigator.mediaDevices.getUserMedia({

video:{facingMode:"environment"}

})

.then(stream=>{

video.srcObject=stream

status.innerText="กล้องพร้อมใช้งาน"

})

.catch(()=>{

status.innerText="ไม่สามารถเปิดกล้องได้"

})




// OCR Scan

setInterval(async()=>{

if(video.videoWidth===0)return


const canvas=document.createElement("canvas")

canvas.width=video.videoWidth
canvas.height=video.videoHeight

const ctx=canvas.getContext("2d")

ctx.drawImage(video,0,0)


const result=await Tesseract.recognize(canvas,"eng")

const raw=result.data.text||""


const numbers=raw.match(/\d{8,}/g)

if(!numbers)return


numbers.forEach(n=>{

const code=n.substring(0,8)

if(ASSETS[code]){

overlay.innerHTML="✅ พบข้อมูลสินทรัพย์<br><br>"+ASSETS[code]

}

})


},2500)

</script>

</body>
</html>
