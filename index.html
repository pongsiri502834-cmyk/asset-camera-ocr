<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Scanner - Debug Version</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root { --accent:#00ff88; }
  body { margin:0; font-family:Arial, sans-serif; background:#000; color:#fff; overflow: hidden; }
  video { width:100vw; height:100vh; object-fit:cover; display:block; }
  #status { position:fixed; top:0; left:0; right:0; z-index:20; background:rgba(220,53,69,0.9); padding:10px; font-size:14px; text-align:center; }
  #overlay { position:fixed; bottom:0; left:0; right:0; z-index:10; background:rgba(0,0,0,0.9); padding:15px; max-height:60%; overflow-y:auto; border-top: 2px solid var(--accent); }
  .roi { position:fixed; inset:0; pointer-events:none; z-index:5; border: 2px dashed var(--accent); margin: auto; width: 80vw; height: 20vh; top: 40%; transform: translateY(-50%); border-radius: 10px; }
  .item-card { margin-bottom:15px; padding:12px; background:rgba(255,255,255,0.1); border-radius:8px; border-left: 5px solid var(--accent); }
</style>
</head>
<body>

<div id="status">⏳ กำลังเตรียมระบบ...</div>
<video id="video" autoplay playsinline></video>
<div class="roi"></div>
<div id="overlay">รอสแกนรหัสสินทรัพย์...</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6J_oXenNdMH3OkJzCUpMDFUSOWWNZugkj7SToFyd6Z5eFu15JUVljoyTn3yk2W5pm/exec";
// ตรวจสอบลิงก์นี้อีกครั้ง ต้องจบด้วย output=csv
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpXuB-T6npWk7MYedMvVFZCNghCnMg9Iu79j0KcMVreOMhksr6pLmOGpdGwfftRzRUMJGnPtr0H4wP/pub?gid=0&single=true&output=csv";

const COL = { CODE:1, DETAIL:3, KEEPER:10 }; // ดึงมาเฉพาะที่จำเป็นก่อนเพื่อลดภาระเครื่อง
let ASSETS_DATA = [];
let locked = false;

// 1. โหลดข้อมูล (พร้อมตัวดัก Error)
async function loadData() {
  const statusEl = document.getElementById("status");
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error("โหลดไฟล์ CSV ไม่ได้ (404)");
    const text = await res.text();
    const parsed = Papa.parse(text, { header: false, skipEmptyLines: true });
    
    ASSETS_DATA = parsed.data.slice(1).map(row => ({
      code: (row[COL.CODE] || "").trim(),
      base: (row[COL.CODE] || "").split('-')[0],
      detail: (row[COL.DETAIL] || "").trim()
    }));

    if(ASSETS_DATA.length === 0) throw new Error("ไฟล์ว่างเปล่า ไม่มีข้อมูล");
    
    statusEl.innerText = `✅ พร้อมใช้งาน (ข้อมูล ${ASSETS_DATA.length} รายการ)`;
    statusEl.style.background = "rgba(40,167,69,0.8)";
  } catch (err) {
    statusEl.innerText = "❌ Error: " + err.message;
    console.error(err);
  }
}

// 2. เปิดกล้อง (รองรับทั้งคอมและมือถือ)
async function startCamera() {
  const video = document.getElementById("video");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: { ideal: "environment" } } 
    });
    video.srcObject = stream;
  } catch (err) {
    document.getElementById("status").innerText = "❌ กล้องมีปัญหา: " + err.name;
  }
}

// 3. ระบบ OCR (ลดขนาดภาพเพื่อไม่ให้ค้าง)
async function initOCR() {
  const worker = await Tesseract.createWorker("eng", 1);
  await worker.setParameters({ tessedit_char_whitelist: "0123456789-" });

  const video = document.getElementById("video");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  setInterval(async () => {
    if (locked || video.readyState < 2 || ASSETS_DATA.length === 0) return;

    // วาดภาพเฉพาะในกรอบสแกน (ลดความละเอียดเพื่อความเร็ว)
    canvas.width = 400; canvas.height = 150;
    ctx.drawImage(video, video.videoWidth*0.1, video.videoHeight*0.35, video.videoWidth*0.8, video.videoHeight*0.2, 0, 0, 400, 150);
    
    const { data: { text } } = await worker.recognize(canvas);
    const clean = text.trim();
    if (clean.length < 5) return;

    const found = ASSETS_DATA.filter(a => a.code.includes(clean) || clean.includes(a.base));
    if (found.length > 0) {
      locked = true;
      renderResults(found);
    }
  }, 1200);
}

function renderResults(items) {
  const overlay = document.getElementById("overlay");
  overlay.innerHTML = `<b>พบ ${items.length} รายการ</b> <button onclick="locked=false; this.parentElement.innerHTML='รอสแกน...'" style="float:right">🔁 สแกนใหม่</button><hr>` + 
    items.map(i => `
      <div class="item-card">
        <b>รหัส:</b> ${i.code}<br>
        <b>รายละเอียด:</b> ${i.detail}<br>
        <button onclick="alert('ฟังก์ชันบันทึกรูปกำลังทำงาน...')">📸 ถ่ายรูป</button>
      </div>
    `).join("");
}

// รันระบบ
loadData();
startCamera();
initOCR();
</script>
</body>
</html>
