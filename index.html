<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Camera Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
:root{--accent:#00ff88;}
body{margin:0;font-family:Arial;background:#000;color:#fff;}
video{width:100vw;height:100vh;object-fit:cover;}

#status{
position:fixed;top:0;left:0;right:0;
background:rgba(0,0,0,.7);
padding:8px;font-size:14px;
}

#overlay{
position:fixed;bottom:0;left:0;right:0;
background:rgba(0,0,0,.85);
color:var(--accent);
padding:10px;font-size:15px;
max-height:45%;overflow:auto;
}

.roi{position:fixed;inset:0;pointer-events:none;}
.roi::before{
content:"";
position:absolute;
left:50%;top:50%;
transform:translate(-50%,-50%);
width:60vw;height:30vh;
border:2px dashed #00ff88;
}
</style>
</head>

<body>

<div id="status">กำลังโหลดข้อมูล…</div>

<div class="roi"></div>

<video id="video" autoplay playsinline></video>

<div id="overlay">รอการสแกน…</div>

<script>

/* =======================
CONFIG
======================= */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQpXuB-T6npWk7MYedMvVFZCNghCnMg9Iu79j0KcMVreOMhksr6pLmOGpdGwfftRzRUMJGnPtr0H4wP/pub?gid=0&single=true&output=csv";

const COLS={
CODE:'B',
DETAIL:'D',
PRICE:'I',
BOOK:'N',
KEEPER:'K',
STATUS:'L',
SERIAL:'G' // เพิ่มหมายเลขผู้ผลิต
};

/* =======================
DOM
======================= */

const video=document.getElementById("video");
const overlay=document.getElementById("overlay");
const statusEl=document.getElementById("status");

/* =======================
UTIL
======================= */

function escapeHTML(str){
return(str??"").toString()
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

function normalizeBase(str){
const m=((str??"")+"").match(/\d{8,9}/);
return m?m[0]:"";
}

function colLetterToIndex(letter){
const s=letter.toUpperCase();
let n=0;
for(let i=0;i<s.length;i++){
n=n*26+(s.charCodeAt(i)-64);
}
return n-1;
}

/* =======================
DATA STORE
======================= */

const ASSETS_BASE=new Map();

/* =======================
LOAD GOOGLE SHEET
======================= */

async function loadSheet(){

const res=await fetch(SHEET_URL);
const text=await res.text();

const parsed=Papa.parse(text,{header:false});

const rows=parsed.data;

let count=0;

for(let i=1;i<rows.length;i++){

const row=rows[i];

const codeB=row[colLetterToIndex(COLS.CODE)];
const base=normalizeBase(codeB);

if(!base)continue;

const detailD=row[colLetterToIndex(COLS.DETAIL)];
const priceI=row[colLetterToIndex(COLS.PRICE)];
const bookN=row[colLetterToIndex(COLS.BOOK)];
const keeperK=row[colLetterToIndex(COLS.KEEPER)];
const statusL=row[colLetterToIndex(COLS.STATUS)];
const serialG=row[colLetterToIndex(COLS.SERIAL)]; // เพิ่ม

const asset={
base,
codeB:(codeB??"").trim(),
detailD:(detailD??"").trim(),
priceI:(priceI??"").trim(),
bookN:(bookN??"").trim(),
keeperK:(keeperK??"").trim(),
statusL:(statusL??"").trim(),
serialG:(serialG??"").trim() // เพิ่ม
};

if(!ASSETS_BASE.has(base))ASSETS_BASE.set(base,[]);

ASSETS_BASE.get(base).push(asset);

count++;

}

statusEl.innerText="โหลดข้อมูลเรียบร้อย "+count+" รายการ";

}

/* =======================
CAMERA
======================= */

async function initCamera(){

const stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});

video.srcObject=stream;

}

/* =======================
OCR
======================= */

let worker;

async function initOCR(){

worker=await Tesseract.createWorker("eng");

await worker.setParameters({
tessedit_char_whitelist:"0123456789"
});

}

/* =======================
ROI
======================= */

function getCanvas(){

const vw=video.videoWidth;
const vh=video.videoHeight;

const roiW=Math.floor(vw*0.6);
const roiH=Math.floor(vh*0.3);

const roiX=Math.floor((vw-roiW)/2);
const roiY=Math.floor((vh-roiH)/2);

const canvas=document.createElement("canvas");
canvas.width=roiW;
canvas.height=roiH;

const ctx=canvas.getContext("2d");

ctx.drawImage(video,roiX,roiY,roiW,roiH,0,0,roiW,roiH);

return canvas;

}

/* =======================
HTML OUTPUT
======================= */

function assetToHTML(a){

return`
<b>รหัส:</b> ${escapeHTML(a.codeB)}<br>
<b>หมายเลขผู้ผลิต:</b> ${escapeHTML(a.serialG)}<br>
<b>รายละเอียด:</b> ${escapeHTML(a.detailD)}<br>
<b>มูลค่า:</b> ${escapeHTML(a.priceI)} บาท<br>
<b>มูลค่าตามบัญชี:</b> ${escapeHTML(a.bookN)} บาท<br>
<b>ชื่อผู้ครอบครอง:</b> ${escapeHTML(a.keeperK)}<br>
<b>สถานะ:</b> ${escapeHTML(a.statusL)}
`;

}

/* =======================
SCAN LOOP
======================= */

async function scan(){

if(video.videoWidth===0)return;

const canvas=getCanvas();

const result=await worker.recognize(canvas);

const raw=result.data.text;

overlay.innerHTML="OCR อ่านได้:<br>"+escapeHTML(raw);

const base=normalizeBase(raw);

if(base){

const items=ASSETS_BASE.get(base);

if(items){

overlay.innerHTML="พบข้อมูลสินทรัพย์<br><br>"+assetToHTML(items[0]);

}

}

}

setInterval(scan,1500);

/* =======================
START
======================= */

(async function(){

await loadSheet();

await initCamera();

await initOCR();

statusEl.innerText+=" • OCR พร้อมใช้งาน";

})();

</script>

</body>
</html>
