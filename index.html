<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Camera Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  :root { --accent:#00ff88; }
  body { margin:0; font-family:Arial, system-ui, sans-serif; background:#000; color:#fff; overflow: hidden; }
  video { width:100vw; height:100vh; object-fit:cover; display:block; }
  
  #status { position:fixed; top:0; left:0; right:0; z-index:10; background:rgba(0,0,0,.7); color:#fff; padding:8px 12px; font-size:14px; }
  #overlay { position:fixed; bottom:0; left:0; right:0; z-index:10; background:rgba(0,0,0,.85); color:var(--accent); padding:15px; font-size:16px; max-height:50%; overflow:auto; border-top: 2px solid var(--accent); }
  #toolbar { position:fixed; top:44px; right:10px; z-index:11; display:flex; gap:8px; flex-wrap:wrap; }
  
  .btn { background:rgba(0,0,0,.6); color:#fff; border:1px solid var(--accent); border-radius:6px; padding:8px 12px; font-size:14px; cursor:pointer; }
  .btn:disabled { opacity:.3; cursor:not-allowed; }

  .roi { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .roi::before { 
    content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); 
    width:70vw; height:25vh; border:2px dashed var(--accent); 
    box-shadow:0 0 0 9999px rgba(0,0,0,.4) inset; border-radius:12px; 
  }
  
  .asset-info b { color: #fff; min-width: 120px; display: inline-block; }
  .btn-edit { display:block; background:#ffc107; color:#000; text-decoration:none; text-align:center; padding:12px; margin-top:15px; border-radius:8px; font-weight:bold; font-size:16px; }
</style>
</head>

<body>
  <div id="status">กำลังเตรียมระบบ...</div>

  <div id="toolbar">
    <button id="btnToggleTorch" class="btn" disabled>🔦 เปิดไฟฉาย</button>
    <button id="btnUnlock" class="btn" disabled>🔁 สแกนใหม่</button>
  </div>

  <div class="roi"></div>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">รอการสแกนรหัสสินทรัพย์...</div>

  <audio id="ding" preload="auto">
    <source src="https://cdn.jsdelivr.net/gh/naptha/tesseract.js@master/docs/examples/data/confirm.mp3" type="audio/mpeg">
  </audio>

<script>
/* ==============================
   CONFIG: ตั้งค่าตำแหน่งคอลัมน์ (อิงตามตัวอักษรใน Google Sheet)
   ============================== */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpXuB-T6npWk7MYedMvVFZCNghCnMg9Iu79j0KcMVreOMhksr6pLmOGpdGwfftRzRUMJGnPtr0H4wP/pub?gid=0&single=true&output=csv";

const COLS = {
  CODE:   'B', // รหัสสินทรัพย์
  NUMBER: 'G', // หมายเลขผู้ผลิต
  DETAIL: 'D', // รายละเอียด
  PRICE:  'I', // มูลค่า
  KEEPER: 'K', // ชื่อผู้ครอบครอง
  STATUS: 'L', // สถานะ
  BOOK:   'N'  // มูลค่าตามบัญชี
};

/* ==============================
   DATA PREPARATION
   ============================== */
const ASSETS_BASE = new Map();

// ฟังก์ชันแปลงตัวอักษรคอลัมน์เป็นตัวเลข Index (A=0, B=1, ...)
function colToIdx(letter) {
  let res = 0;
  for (let i = 0; i < letter.length; i++) {
    res = res * 26 + (letter.charCodeAt(i) - 64);
  }
  return res - 1;
}

async function loadSheet() {
  try {
    const res = await fetch(SHEET_URL, { cache: "no-store" });
    const text = await res.text();
    // ใช้ header: false เพื่อป้องกันปัญหาชื่อหัวตารางซ้ำหรือเยื้อง
    const parsed = Papa.parse(text, { header: false, skipEmptyLines: true });
    const rows = parsed.data;
    let count = 0;

    for (let i = 1; i < rows.length; i++) { // เริ่มแถวที่ 2 (index 1) เพื่อข้ามหัวตาราง
      const row = rows[i];
      const rawCode = row[colToIdx(COLS.CODE)] || "";
      const base = normalizeBase(rawCode);
      
      if (!base) continue;

      const asset = {
        codeB:    rawCode.toString().trim(),
        numberG:  (row[colToIdx(COLS.NUMBER)] || "").toString().trim(),
        detailD:  (row[colToIdx(COLS.DETAIL)] || "").toString().trim(),
        priceI:   (row[colToIdx(COLS.PRICE)]  || "").toString().trim(),
        keeperK:  (row[colToIdx(COLS.KEEPER)] || "").toString().trim(),
        statusL:  (row[colToIdx(COLS.STATUS)] || "").toString().trim(),
        bookN:    (row[colToIdx(COLS.BOOK)]   || "").toString().trim()
      };

      if (!ASSETS_BASE.has(base)) ASSETS_BASE.set(base, []);
      ASSETS_BASE.get(base).push(asset);
      count++;
    }
    document.getElementById("status").innerText = `โหลดข้อมูลสำเร็จ: ${count.toLocaleString()} รายการ`;
  } catch (e) {
    document.getElementById("status").innerText = "❌ โหลดข้อมูลไม่สำเร็จ";
    console.error(e);
  }
}

/* ==============================
   SCANNER & OCR LOGIC
   ============================== */
let video = document.getElementById("video");
let overlay = document.getElementById("overlay");
let btnUnlock = document.getElementById("btnUnlock");
let track = null, worker = null, workerReady = false, locked = false;

function normalizeBase(str) {
  const m = (str + "").match(/\d{9,15}/); // ค้นหาตัวเลข 9 หลักขึ้นไป
  return m ? m[0] : "";
}

function escapeHTML(str) {
  return (str || "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function assetToHTML(a) {
  const baseFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSd2E7Rw0_BbJPL_BtZCaICXCXxLDMFYoa4IwpJCXnK2dxqDUw/viewform?usp=pp_url&entry.490555334=";
  const finalUrl = baseFormUrl + encodeURIComponent(a.codeB);

  return `
    <div class="asset-info">
      <b>รหัส:</b> ${escapeHTML(a.codeB)}<br>
      <b>รายละเอียด:</b> ${escapeHTML(a.detailD)}<br>
      <b>หมายเลขผู้ผลิต:</b> ${escapeHTML(a.numberG)}<br>
      <b>มูลค่า:</b> ${escapeHTML(a.priceI)} บาท<br>
      <b>มูลค่าตามบัญชี:</b> ${escapeHTML(a.bookN)} บาท<br>
      <b>ชื่อผู้ครอบครอง:</b> ${escapeHTML(a.keeperK)}<br>
      <b>สถานะ:</b> ${escapeHTML(a.statusL)}
    </div>
    <a href="${finalUrl}" target="_blank" class="btn-edit">⚠️ ข้อมูลไม่ถูกต้อง? คลิกแจ้งแก้ไข</a>
  `;
}

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } 
    });
    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities?.() || {};
    if ("torch" in caps) document.getElementById("btnToggleTorch").disabled = false;
  } catch (err) {
    alert("ไม่สามารถเข้าถึงกล้องได้: " + err);
  }
}

async function initOcr() {
  worker = await Tesseract.createWorker("eng", 1);
  await worker.setParameters({ 
    tessedit_char_whitelist: "0123456789", 
    classify_bln_numeric_mode: "1" 
  });
  workerReady = true;
}

function getRoiCanvas() {
  if (video.readyState < 2) return null;
  const vw = video.videoWidth, vh = video.videoHeight;
  const canvas = document.createElement("canvas");
  const roiW = Math.floor(vw * 0.70), roiH = Math.floor(vh * 0.25);
  canvas.width = roiW; canvas.height = roiH;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, (vw - roiW) / 2, (vh - roiH) / 2, roiW, roiH, 0, 0, roiW, roiH);
  
  // ปรับภาพเป็นขาวดำเพื่อเพิ่มความแม่นยำ (Binarization)
  const img = ctx.getImageData(0, 0, roiW, roiH);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (d[i] * 0.3 + d[i+1] * 0.59 + d[i+2] * 0.11) < 128 ? 0 : 255;
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(img, 0, 0);
  return canvas;
}

async function scanLoop() {
  if (!workerReady || locked) return;
  const canvas = getRoiCanvas();
  if (!canvas) return;

  try {
    const { data: { text } } = await worker.recognize(canvas);
    const base = normalizeBase(text);
    if (base && ASSETS_BASE.has(base)) {
      locked = true;
      const items = ASSETS_BASE.get(base);
      overlay.innerHTML = `✅ <b>พบข้อมูลสินทรัพย์</b><br><br>${assetToHTML(items[0])}`;
      btnUnlock.disabled = false;
      document.getElementById("ding").play().catch(() => {});
      if (navigator.vibrate) navigator.vibrate(100);
    }
  } catch (e) {}
}

/* ==============================
   EVENTS & INITIALIZATION
   ============================== */
btnUnlock.onclick = () => {
  locked = false;
  btnUnlock.disabled = true;
  overlay.innerHTML = "รอการสแกนรหัสสินทรัพย์...";
};

document.getElementById("btnToggleTorch").onclick = async function() {
  const isTorch = this.innerText.includes("เปิด");
  await track.applyConstraints({ advanced: [{ torch: isTorch }] });
  this.innerText = isTorch ? "🔦 ปิดไฟฉาย" : "🔦 เปิดไฟฉาย";
};

(async function() {
  await loadSheet();
  await initCamera();
  await initOcr();
  setInterval(scanLoop, 800); // สแกนทุกๆ 0.8 วินาที
})();
</script>
</body>
</html>
