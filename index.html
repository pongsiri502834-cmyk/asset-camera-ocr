<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Camera Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  :root { --accent:#00ff88; }
  body { margin:0; font-family:Arial, system-ui, sans-serif; background:#000; color:#fff; }
  video { width:100vw; height:100vh; object-fit:cover; display:block; }

  #status { position:fixed; top:0; left:0; right:0; z-index:10;
    background:rgba(0,0,0,.7); color:#fff; padding:8px 12px; font-size:14px; }

  #overlay { position:fixed; bottom:0; left:0; right:0; z-index:10;
    background:rgba(0,0,0,.85); color:var(--accent);
    padding:10px; font-size:15px; max-height:45%; overflow:auto; }

  #toolbar { position:fixed; top:44px; right:10px; z-index:11; display:flex; gap:8px; flex-wrap:wrap; }
  .btn { background:rgba(0,0,0,.6); color:#fff; border:1px solid var(--accent);
    border-radius:6px; padding:6px 10px; font-size:14px; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .roi { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .roi::before{
    content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:60vw; height:30vh; border:2px dashed rgba(0,255,136,.9);
    box-shadow:0 0 0 9999px rgba(0,0,0,.35) inset, 0 0 12px rgba(0,255,136,.5);
    border-radius:8px;
  }

  .small{ color:#ccc; font-size:12px; }
  .hr { height:1px; border:0; background:rgba(255,255,255,.1); margin:8px 0; }
  ul.asset-list { margin:6px 0 0 18px; padding:0; }
  ul.asset-list li { margin-bottom:10px; }
</style>
</head>

<body>
  <div id="status">กำลังโหลดข้อมูล…</div>

  <div id="toolbar">
    <button id="btnToggleTorch" class="btn" disabled>🔦 เปิดไฟฉาย</button>
    <button id="btnUnlock" class="btn" disabled>🔁 สแกนใหม่</button>
  </div>

  <div class="roi" aria-hidden="true"></div>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">รอการสแกน…</div>

  <audio id="ding" preload="auto">
    <source src="https://cdn.jsdelivr.net/gh/naptha/tesseract.js@master/docs/examples/data/confirm.mp3" type="audio/mpeg">
  </audio>

<script>
/* ==============================
   CONFIG (จุดที่แก้ไข URL)
   ============================== */
// ลิงก์ CSV จาก Google Sheet (ตามรูปภาพที่คุณส่งมาล่าสุด)
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpXuB-T6npWk7MYedMvVFZCNghCnMg9Iu79j0KcMVreOMhksr6pLmOGpdGwfftRzRUMJGnPtr0H4wP/pub?gid=0&single=true&output=csv";

/** อ้างอิงด้วย “ตัวอักษรคอลัมน์” */
const COLS = {
  CODE:   'B',   // รหัส
  DETAIL: 'D',   // รายละเอียด
  PRICE:  'I',   // มูลค่า
  BOOK:   'N',   // มูลค่าตามบัญชี
  KEEPER: 'K',   // ชื่อผู้ครอบครอง
  STATUS: 'L',   // สถานะ
  NUMBER: 'G'    // หมายเลขผู้ผลิต (คอลัมน์ G)
};

const HEADERS = {
  CODE:   "", 
  DETAIL: "", 
  PRICE:  "", 
  BOOK:   "", 
  KEEPER: "", 
  STATUS: "",
  NUMBER: ""  
};

/* ==============================
   DOM & Utils
   ============================== */
const video   = document.getElementById("video");
const overlay = document.getElementById("overlay");
const statusEl  = document.getElementById("status");
const btnUnlock = document.getElementById("btnUnlock");
const btnToggleTorch = document.getElementById("btnToggleTorch");
const ding = document.getElementById("ding");

function escapeHTML(str){
  return (str??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

// ปรับให้ดึงตัวเลข 9 หลักขึ้นไปเพื่อให้แมตช์กับรหัสใน Sheet
function normalizeBase(str){
  const m = ((str??"")+"").match(/\d{9,15}/);
  return m ? m[0] : "";
}

function colLetterToIndex(letter){
  const s = (letter||"").toUpperCase().trim();
  let n = 0;
  for (let i=0; i<s.length; i++){ n = n*26 + (s.charCodeAt(i)-64); }
  return n-1;
}

function pickValue(rowObjOrArr, headerName, fallbackColLetter, headerMap){
  if (!Array.isArray(rowObjOrArr)) {
    if (headerMap && fallbackColLetter) {
      const headerKey = headerMap[fallbackColLetter];
      if (headerKey && rowObjOrArr[headerKey] !== undefined) return rowObjOrArr[headerKey];
    }
    return "";
  }
  const idx = colLetterToIndex(fallbackColLetter);
  return (rowObjOrArr[idx] ?? "");
}

/* ==============================
   Load Google Sheet
   ============================== */
const ASSETS_BASE = new Map();

async function loadSheet(){
  try{
    const res = await fetch(SHEET_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();

    let parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    let useHeader = (parsed.meta.fields && parsed.meta.fields.length > 1);

    const headerMap = {};
    if (useHeader) {
      parsed.meta.fields.forEach((k, i) => {
        headerMap[String.fromCharCode(65 + i)] = k;
      });
    }

    const rows = parsed.data;
    let count = 0;

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const codeB = pickValue(row, "", COLS.CODE, headerMap);
      
      // ดึงตัวเลขล้วนจากรหัสใน Sheet เพื่อใช้เป็น Key ในการค้นหา
      const base = normalizeBase(codeB);
      if (!base) continue;

      const asset = {
        base,
        codeB:    (codeB ?? "").toString().trim(),
        detailD:  (pickValue(row, "", COLS.DETAIL, headerMap) ?? "").toString().trim(),
        priceI:   (pickValue(row, "", COLS.PRICE,  headerMap) ?? "").toString().trim(),
        bookN:    (pickValue(row, "", COLS.BOOK,   headerMap) ?? "").toString().trim(),
        keeperK:  (pickValue(row, "", COLS.KEEPER, headerMap) ?? "").toString().trim(),
        statusL:  (pickValue(row, "", COLS.STATUS, headerMap) ?? "").toString().trim(),
        numberG:  (pickValue(row, "", COLS.NUMBER, headerMap) ?? "").toString().trim()   
      };

      if (!ASSETS_BASE.has(base)) ASSETS_BASE.set(base, []);
      ASSETS_BASE.get(base).push(asset);
      count++;
    }
    statusEl.innerText = `โหลดข้อมูลเรียบร้อย • แถว: ${count.toLocaleString()} • เลขฐาน: ${ASSETS_BASE.size.toLocaleString()}`;
  }catch(e){
    console.error(e);
    statusEl.innerText = "โหลด Google Sheet ไม่สำเร็จ: " + e.message;
  }
}

/* ==============================
   Camera & OCR
   ============================== */
let track=null, torchOn=false;
async function initCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080} },
      audio:false
    });
    video.srcObject = stream;
    statusEl.innerText = "กล้องพร้อมใช้งาน";
    track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities?.() || {};
    if("torch" in caps) btnToggleTorch.disabled = false;
  }catch(err){
    statusEl.innerText = "ไม่สามารถเปิดกล้องได้: " + (err.message||err);
  }
}

let worker, workerReady=false;
async function initOcr(){
  worker = await Tesseract.createWorker("eng",1);
  await worker.setParameters({
    tessedit_char_whitelist:"0123456789",
    classify_bln_numeric_mode:"1"
  });
  workerReady = true;
}

/* ==============================
   Scan Result & HTML
   ============================== */
function assetToHTML(a){
  const baseFormUrl = "https://docs.google.com/forms/d/e/1FAIpQLSd2E7Rw0_BbJPL_BtZCaICXCXxLDMFYoa4IwpJCXnK2dxqDUw/viewform?usp=pp_url&entry.490555334=";
  const finalUrl = baseFormUrl + encodeURIComponent(a.codeB);

  return `
    <div style="line-height: 1.6; color: #fff;">
      <b>รหัส:</b> ${escapeHTML(a.codeB)}<br>
      <b>รายละเอียด:</b> ${escapeHTML(a.detailD)}<br>
      <b>หมายเลขผู้ผลิต:</b> ${escapeHTML(a.numberG)}<br>
      <b>มูลค่า:</b> ${escapeHTML(a.priceI)} บาท<br>
      <b>ชื่อผู้ครอบครอง:</b> ${escapeHTML(a.keeperK)}<br>
      <b>สถานะ:</b> ${escapeHTML(a.statusL)}
    </div>
    <a href="${finalUrl}" target="_blank" style="display:block; background:#ffc107; color:#000; text-decoration:none; text-align:center; padding:12px; margin-top:15px; border-radius:8px; font-weight:bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
      ⚠️ ข้อมูลไม่ถูกต้อง? คลิกแจ้งแก้ไข
    </a>
  `;
}

/* ==============================
   Loop Scan
   ============================== */
let locked=false, lastRun=0;

function getRoiCanvas(){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return null;
  const roiW=Math.floor(vw*0.60), roiH=Math.floor(vh*0.30);
  const roiX=Math.floor((vw-roiW)/2), roiY=Math.floor((vh-roiH)/2);
  const canvas=document.createElement("canvas");
  canvas.width=roiW; canvas.height=roiH;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(video, roiX,roiY,roiW,roiH, 0,0,roiW,roiH);
  
  // ปรับภาพเป็น ขาว-ดำ เพื่อให้อ่านลายมือได้ง่ายขึ้น
  const img=ctx.getImageData(0,0,roiW,roiH); const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const gray=(d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
    const v = gray < 120 ? 0 : 255; 
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,0,0);
  return canvas;
}

async function loopScan(){
  if(!workerReady||locked||Date.now()-lastRun < 1200) return;
  if(video.readyState < 2) return;
  lastRun=Date.now();
  const canvas=getRoiCanvas();
  if(!canvas) return;

  try{
    const {data} = await worker.recognize(canvas);
    const raw=(data.text||"").replace(/\s+/g," ").trim();
    const base = normalizeBase(raw);

    if(base){
      const items = ASSETS_BASE.get(base);
      if(items && items.length>0){
        locked=true;
        overlay.innerHTML = `✅ พบข้อมูลสินทรัพย์<br><br>${assetToHTML(items[0])}`;
        try{ding.play();}catch{}
        btnUnlock.disabled=false;
      } else {
        overlay.innerHTML = `OCR อ่านได้: ${escapeHTML(base)}<br><span style="color:red;">⚠️ ไม่พบในฐานข้อมูล</span>`;
      }
    }
  }catch(e){ console.error(e); }
}

btnUnlock.addEventListener("click", ()=>{ locked=false; btnUnlock.disabled=true; overlay.innerHTML="รอการสแกน…"; });
btnToggleTorch.addEventListener("click", async ()=>{
  torchOn = !torchOn;
  await track.applyConstraints({advanced:[{torch:torchOn}]});
  btnToggleTorch.textContent = torchOn ? "🔦 ปิดไฟฉาย" : "🔦 เปิดไฟฉาย";
});

(async function main(){
  await loadSheet();
  await initCamera();
  await initOcr();
  statusEl.innerText += " • พร้อมสแกน";
  setInterval(loopScan, 500);
})();
</script>
</body>
</html>
