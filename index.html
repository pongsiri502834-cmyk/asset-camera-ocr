<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Camera Scanner</title>

<!-- Tesseract.js v5 -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  :root { --accent:#00ff88; }
  body { margin:0; font-family:Arial, system-ui, sans-serif; background:#000; color:#fff; }
  video { width:100vw; height:100vh; object-fit:cover; display:block; }

  #status { position:fixed; top:0; left:0; right:0; z-index:10;
    background:rgba(0,0,0,.7); color:#fff; padding:8px 12px; font-size:14px; }

  #overlay { position:fixed; bottom:0; left:0; right:0; z-index:10;
    background:rgba(0,0,0,.85); color:var(--accent);
    padding:10px; font-size:15px; max-height:45%; overflow:auto; }

  #toolbar { position:fixed; top:44px; right:10px; z-index:11; display:flex; gap:8px; flex-wrap:wrap; }
  .btn { background:rgba(0,0,0,.6); color:#fff; border:1px solid var(--accent);
    border-radius:6px; padding:6px 10px; font-size:14px; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  .roi { position:fixed; inset:0; pointer-events:none; z-index:5; }
  .roi::before{
    content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:60vw; height:30vh; border:2px dashed rgba(0,255,136,.9);
    box-shadow:0 0 0 9999px rgba(0,0,0,.35) inset, 0 0 12px rgba(0,255,136,.5);
    border-radius:8px;
  }

  .small{ color:#ccc; font-size:12px; }
  .hr { height:1px; border:0; background:rgba(255,255,255,.1); margin:8px 0; }
  ul.asset-list { margin:6px 0 0 18px; padding:0; }
  ul.asset-list li { margin-bottom:10px; }
</style>
</head>

<body>
  <div id="status">กำลังโหลดข้อมูล…</div>

  <div id="toolbar">
    <button id="btnToggleTorch" class="btn" disabled>🔦 เปิดไฟฉาย</button>
    <button id="btnUnlock" class="btn" disabled>🔁 สแกนใหม่</button>
  </div>

  <div class="roi" aria-hidden="true"></div>
  <video id="video" autoplay playsinline></video>
  <div id="overlay">รอการสแกน…</div>

  <audio id="ding" preload="auto">
    <source src="https://cdn.jsdelivr.net/gh/naptha/tesseract.js@master/docs/examples/data/confirm.mp3" type="audio/mpeg">
  </audio>

<script>
/* ==============================
   CONFIG
   ============================== */
const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpXuB-T6npWk7MYedMvVFZCNghCnMg9Iu79j0KcMVreOMhksr6pLmOGpdGwfftRzRUMJGnPtr0H4wP/pub?gid=0&single=true&output=csv";

/** อ้างอิงด้วย “ตัวอักษรคอลัมน์” */
const COLS = {
  CODE:   'B',   // รหัส
  DETAIL: 'D',   // รายละเอียด
  PRICE:  'I',   // มูลค่า
  BOOK:   'N',   // มูลค่าตามบัญชี
  KEEPER: 'K',   // ชื่อผู้ครอบครอง
  STATUS: 'L',   // สถานะ
  MANUF:  'G'    // หมายเลขผู้ผลิต (เพิ่ม)
};

/** (ถ้ามี) ใส่ชื่อหัวคอลัมน์จริง เพื่อความชัวร์ยิ่งขึ้น */
const HEADERS = {
  CODE:   "",              // เช่น "รหัส"
  DETAIL: "",             // เช่น "รายละเอียด"
  PRICE:  "",             // เช่น "มูลค่า"
  BOOK:   "",             // เช่น "มูลค่าตามบัญชี"
  KEEPER: "",             // เช่น "ชื่อผู้ครอบครอง"
  STATUS: "",             // เช่น "สถานะ"
  MANUF:  "หมายเลขผู้ผลิต" // ชื่อหัวคอลัมน์ภาษาไทยในชีต
};

/* ==============================
   DOM
   ============================== */
const video   = document.getElementById("video");
const overlay = document.getElementById("overlay");
const statusEl  = document.getElementById("status");
const btnUnlock = document.getElementById("btnUnlock");
const btnToggleTorch = document.getElementById("btnToggleTorch");
const ding = document.getElementById("ding");

/* ==============================
   Utils
   ============================== */
function escapeHTML(str){
  return (str ?? "").toString()
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");
}
const THAI_DIGITS = { '๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9' };
function toArabicDigits(s){
  return (s ?? "").replace(/[๐-๙]/g, ch => THAI_DIGITS[ch] || ch);
}
function normalizeBase(str){
  const cleaned = toArabicDigits((str ?? "")).replace(/[^\d]/g, "");
  const m = cleaned.match(/\d{8,9}/); // ปรับช่วงหลักตามรูปแบบรหัสจริง
  return m ? m[0] : "";
}
function colLetterToIndex(letter){
  const s = (letter||"").toUpperCase().trim();
  let n = 0;
  for (let i=0; i<s.length; i++){
    n = n*26 + (s.charCodeAt(i)-64);
  }
  return n-1;
}
/** header helper */
function getByHeader(rowObj, headerName){
  if(!headerName) return undefined;
  const keys = Object.keys(rowObj);
  const target = headerName.replace(/\s+/g,'').toLowerCase();
  for (const k of keys){
    const norm = k.replace(/\s+/g,'').toLowerCase();
    if (norm === target) return rowObj[k];
  }
  return undefined;
}
/** pick value (object with header OR array with index) */
function pickValue(rowObjOrArr, headerName, fallbackColLetter, headerMap){
  if (!Array.isArray(rowObjOrArr)) {
    const v = getByHeader(rowObjOrArr, headerName);
    if (v !== undefined && v !== null && v !== "") return v;
    if (headerMap && fallbackColLetter) {
      const headerKey = headerMap[fallbackColLetter];
      if (headerKey && rowObjOrArr[headerKey] !== undefined) return rowObjOrArr[headerKey];
    }
    return "";
  }
  const idx = colLetterToIndex(fallbackColLetter);
  return (rowObjOrArr[idx] ?? "");
}
/** เช็คว่าเป็น “ตัวเลขเงิน” ไหม */
function looksLikeNumber(x){
  return typeof x === "string"
    ? !!x.trim() && /^[\d.,]+$/.test(x.trim())
    : typeof x === "number";
}
/** ปรับรูปแบบเลข: ตัดคอมมา, เว้นจุดทศนิยม */
function normalizeNumberStr(x){
  const s = (x ?? "").toString().trim();
  if (!s) return s;
  const cleaned = s.replace(/,/g,'');
  return cleaned;
}

/* ==============================
   Data store
   ============================== */
const ASSETS_BASE = new Map(); // key: base, value: Array<asset>

/* ==============================
   โหลดชีต
   ============================== */
async function loadSheet(){
  try{
    const res = await fetch(SHEET_URL,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text = await res.text();

    // พยายามใช้ header ก่อน
    let parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    let useHeader = true;

    if (!parsed.data || !parsed.data.length || Object.keys(parsed.data[0]).length <= 1) {
      parsed = Papa.parse(text, { header: false, skipEmptyLines: true });
      useHeader = false;
    }

    // map letter -> headerKey (เมื่อ header:true)
    const headerMap = {};
    if (useHeader) {
      const fields = (parsed.meta.fields || []).map(f => (f||"").trim());
      fields.forEach((k, i) => {
        const letter = String.fromCharCode(65 + i); // 65='A'
        headerMap[letter] = k;
      });
    }

    const rows = parsed.data;
    let count = 0;

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];

      const codeB = useHeader
        ? pickValue(row, HEADERS.CODE,   COLS.CODE,   headerMap)
        : pickValue(row, "",            COLS.CODE);
      const base = normalizeBase(codeB);
      if (!base) continue;

      const detailD = useHeader
        ? pickValue(row, HEADERS.DETAIL, COLS.DETAIL, headerMap)
        : pickValue(row, "",            COLS.DETAIL);

      const priceI = useHeader
        ? pickValue(row, HEADERS.PRICE,  COLS.PRICE,  headerMap)
        : pickValue(row, "",            COLS.PRICE);

      let bookN = useHeader
        ? pickValue(row, HEADERS.BOOK,   COLS.BOOK,   headerMap)
        : pickValue(row, "",            COLS.BOOK);

      let keeperK = useHeader
        ? pickValue(row, HEADERS.KEEPER, COLS.KEEPER, headerMap)
        : pickValue(row, "",            COLS.KEEPER);

      const statusL = useHeader
        ? pickValue(row, HEADERS.STATUS, COLS.STATUS, headerMap)
        : pickValue(row, "",            COLS.STATUS);

      // (ใหม่) อ่านคอลัมน์ G: หมายเลขผู้ผลิต
      const manufG = useHeader
        ? pickValue(row, HEADERS.MANUF,  COLS.MANUF,  headerMap)
        : pickValue(row, "",             COLS.MANUF);

      // ---------- Heuristic กันคอลัมน์สลับ ----------
      const bookLooksNumeric   = looksLikeNumber(bookN);
      const keeperLooksNumeric = looksLikeNumber(keeperK);
      const bookLooksText      = /[^\d.,]/.test((bookN ?? "").toString());
      const keeperLooksText    = /[^\d.,]/.test((keeperK ?? "").toString());

      if (!bookLooksNumeric && keeperLooksNumeric && bookLooksText) {
        const tmp = bookN; bookN = keeperK; keeperK = tmp;
      }

      const asset = {
        base,
        codeB:    (codeB ?? "").toString().trim(),
        detailD:  (detailD ?? "").toString().trim(),
        priceI:   (priceI ?? "").toString().trim(),
        bookN:    (bookN ?? "").toString().trim(),
        keeperK:  (keeperK ?? "").toString().trim(),
        statusL:  (statusL ?? "").toString().trim(),
        manufG:   (manufG ?? "").toString().trim() // (ใหม่) เก็บหมายเลขผู้ผลิต
      };

      if (!ASSETS_BASE.has(base)) ASSETS_BASE.set(base, []);
      ASSETS_BASE.get(base).push(asset);
      count++;
    }

    statusEl.innerText = `โหลดข้อมูลเรียบร้อย • แถว: ${count.toLocaleString()} • เลขฐาน: ${ASSETS_BASE.size.toLocaleString()}`;
  }catch(e){
    console.error(e);
    statusEl.innerText = "โหลด Google Sheet ไม่สำเร็จ";
  }
}

/* ==============================
   กล้อง & ไฟฉาย
   ============================== */
let track=null, torchOn=false;
async function initCamera(){
  try{
    video.muted = true;       // ช่วยให้ autoplay ได้บน iOS
    video.playsInline = true; // เล่นแบบ in-page

    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1920}, height:{ideal:1080},
        advanced: [
          { focusMode: "continuous" }, // ถ้ารองรับ
          { zoom: 1.5 }                // ถ้ารองรับ
        ]
      },
      audio:false
    });
    video.srcObject = stream;
    await video.play().catch(()=>{});
    statusEl.innerText = "กล้องพร้อมใช้งาน";
    track = stream.getVideoTracks()[0];

    try{
      const caps = track.getCapabilities?.() || {};
      if("torch" in caps) btnToggleTorch.disabled = false;
    }catch{}
  }catch(err){
    console.error(err);
    statusEl.innerText = "ไม่สามารถเปิดกล้องได้: " + (err.message||err);
  }
}
btnToggleTorch.addEventListener("click", async ()=>{
  if(!track) return;
  try{
    const caps = track.getCapabilities?.() || {};
    if(!("torch" in caps)) return;
    torchOn = !torchOn;
    await track.applyConstraints({advanced:[{torch:torchOn}]});
    btnToggleTorch.textContent = torchOn ? "🔦 ปิดไฟฉาย" : "🔦 เปิดไฟฉาย";
  }catch(e){ console.warn("Torch error:", e); }
});

/* ==============================
   Tesseract (v5 API ที่ถูกต้อง)
   ============================== */
let worker, workerReady=false;
async function initOcr(){
  worker = await Tesseract.createWorker({ logger: () => {} });
  await worker.loadLanguage('eng');
  await worker.initialize('eng');
  await worker.setParameters({
    tessedit_char_whitelist:"0123456789",
    classify_bln_numeric_mode:"1",
    tessedit_pageseg_mode:"7", // single line
    user_defined_dpi:"220"     // ช่วยความคม
  });
  workerReady = true;
}

/* ==============================
   Scan loop
   ============================== */
let locked=false, lastRun=0;
const SCAN_INTERVAL_MS = 1200;
let pageActive = true;
document.addEventListener('visibilitychange', () => {
  pageActive = !document.hidden;
});

function getRoiCanvas(forOcr = false){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return null;

  const roiW=Math.floor(vw*0.60), roiH=Math.floor(vh*0.30);
  const roiX=Math.floor((vw-roiW)/2), roiY=Math.floor((vh-roiH)/2);

  const scale = forOcr ? 1.6 : 1.0;
  const W = Math.round(roiW * scale), H = Math.round(roiH * scale);

  const canvas=document.createElement("canvas");
  canvas.width=W; canvas.height=H;

  const ctx=canvas.getContext("2d", { willReadFrequently: true });
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(video, roiX,roiY,roiW,roiH, 0,0,W,H);

  // grayscale + adaptive threshold แบบง่าย
  const img=ctx.getImageData(0,0,W,H); const d=img.data;
  let sum=0;
  for(let i=0;i<d.length;i+=4){
    const gray=(d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
    sum+=gray;
  }
  const mean = sum / (d.length/4);
  const T = mean * 0.92; // ลดนิดให้เข้มขึ้น

  for(let i=0;i<d.length;i+=4){
    const gray=(d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
    const v = gray < T ? 0 : 255;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,0,0);
  return canvas;
}

function assetToHTML(a){
  return `
    <b>รหัส:</b> ${escapeHTML(a.codeB)}<br>
    <b>รายละเอียด:</b> ${escapeHTML(a.detailD)}<br>
    <b>มูลค่า:</b> ${escapeHTML(a.priceI)} บาท<br>
    <b>มูลค่าตามบัญชี:</b> ${escapeHTML(a.bookN)} บาท<br>
    <b>ชื่อผู้ครอบครอง:</b> ${escapeHTML(a.keeperK)}<br>
    <b>สถานะ:</b> ${escapeHTML(a.statusL)}<br>
    <b>หมายเลขผู้ผลิต:</b> ${escapeHTML(a.manufG)}
  `;
}

async function loopScan(){
  const now=Date.now();
  if (!pageActive) return;
  if(!workerReady||locked) return;
  if(now-lastRun<SCAN_INTERVAL_MS) return;
  if(video.readyState<2||video.videoWidth===0) return;

  lastRun=now;

  const canvas=getRoiCanvas(true);
  if(!canvas) return;

  try{
    const {data} = await worker.recognize(canvas);
    const raw=(data.text||"").replace(/\s+/g," ").trim();

    overlay.innerHTML = `OCR อ่านได้:<br><span class="small">${escapeHTML(raw)}</span>`;

    const base = normalizeBase(raw);
    if(base){
      const items = ASSETS_BASE.get(base);
      if(items && items.length>0){
        locked=true;
        if(items.length===1){
          overlay.innerHTML = `✅ พบข้อมูลสินทรัพย์<br><br>${assetToHTML(items[0])}`;
        }else{
          const lis = items.map(a=>`<li>${assetToHTML(a)}</li>`).join("");
          overlay.innerHTML = `
            ✅ พบข้อมูลสินทรัพย์ ${items.length} รายการ ที่มีเลขฐาน ${escapeHTML(base)}
            <div class="hr"></div>
            <ul class="asset-list">${lis}</ul>
          `;
        }
        try{navigator.vibrate?.(120);}catch{}
        try{ding.currentTime=0; ding.play().catch(()=>{});}catch{}
        btnUnlock.disabled=false;
      }else{
        overlay.innerHTML = `⚠️ พบเลขฐาน ${escapeHTML(base)}<br>แต่ไม่พบในฐานข้อมูล`;
      }
    }
  }catch(e){
    console.error("OCR error:", e);
  }
}

btnUnlock.addEventListener("click", ()=>{
  locked=false; btnUnlock.disabled=true; overlay.innerHTML="รอการสแกน…";
});
setInterval(loopScan,200);

/* ==============================
   Cleanup & Start
   ============================== */
window.addEventListener('beforeunload', () => {
  try { track?.stop(); } catch {}
  try { worker?.terminate(); } catch {}
});

(async function main(){
  await loadSheet();
  await initCamera();
  await initOcr();
  statusEl.innerText += " • OCR พร้อมใช้งาน";
})();
</script>
</body>
</html>
